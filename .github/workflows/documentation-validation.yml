name: Documentation validation

on:
  pull_request:
    paths:
      - '**.md'
      - 'scenarios/**'
      - 'countermeasures/**'
      - 'evidence/**'
      - 'templates/**'
      - 'governance/**'
      - 'scripts/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/documentation-validation.yml'
  push:
    paths:
      - '**.md'
      - 'scenarios/**'
      - 'countermeasures/**'
      - 'evidence/**'
      - 'templates/**'
      - 'governance/**'
      - 'scripts/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/documentation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine comparison baseline
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "sha=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate document structure and references
        run: python scripts/validate_documentation.py

      - name: Validate versions and timestamps
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: python scripts/validate_versions.py --base "$BASE_SHA"

      - name: Validate historical integrity
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: python scripts/validate_integrity.py --base "$BASE_SHA"
